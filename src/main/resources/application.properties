# App
spring.application.name=whatsapp-clone

# PostgreSQL - UTC timezone fixes Asia/Calcutta error
spring.datasource.url=jdbc:postgresql://localhost:5432/whatsapp_db?serverTimezone=UTC&TimeZone=UTC
spring.datasource.username=admin
spring.datasource.password=admin123
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Force UTC timezone for JVM
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=whatsapp-group
spring.kafka.consumer.auto-offset-reset=earliest

# JWT
jwt.secret=whatsapp_super_secret_key_123456789_must_be_long_enough
jwt.expiration=86400000