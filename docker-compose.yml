version: '3.8'

services:

  postgres:
    image: postgres:15
    container_name: whatsapp_postgres
    environment:
      POSTGRES_DB: whatsapp_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      TZ: Asia/Kolkata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - whatsapp-network

  redis:
    image: redis:7
    container_name: whatsapp_redis
    ports:
      - "6379:6379"
    networks:
      - whatsapp-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: whatsapp_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    networks:
      - whatsapp-network

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: whatsapp_kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - whatsapp-network

  app:
    build: .
    container_name: whatsapp_app
    depends_on:
      - postgres
      - redis
      - kafka
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/whatsapp_db?serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: admin123
      SPRING_DATA_REDIS_HOST: redis
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JAVA_TOOL_OPTIONS: -Duser.timezone=Asia/Kolkata
    networks:
      - whatsapp-network

volumes:
  postgres_data:

networks:
  whatsapp-network:
    driver: bridge