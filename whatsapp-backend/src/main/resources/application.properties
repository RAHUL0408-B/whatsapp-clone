# App
spring.application.name=whatsapp-clone
server.port=${PORT:8080}

# PostgreSQL - supports Render's DATABASE_URL or individual vars
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:Whatsapp-clone}}
spring.datasource.username=${POSTGRES_USER:admin}
spring.datasource.password=${POSTGRES_PASSWORD:0408}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool (important for Render free tier)
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=300000

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Redis - conditional (disabled on Render via REDIS_ENABLED=false)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.connect-timeout=2000ms
spring.data.redis.timeout=2000ms

# Kafka - conditional (disabled on Render via KAFKA_ENABLED=false)
spring.kafka.bootstrap-servers=${KAFKA_BROKERS:localhost:9092}
spring.kafka.consumer.group-id=whatsapp-group
spring.kafka.consumer.auto-offset-reset=earliest

# Feature flags - set REDIS_ENABLED=false and KAFKA_ENABLED=false on Render
app.redis.enabled=${REDIS_ENABLED:true}
app.kafka.enabled=${KAFKA_ENABLED:true}

# Exclude Redis and Kafka auto-configuration when disabled
spring.autoconfigure.exclude=${SPRING_AUTOCONFIGURE_EXCLUDE:}

# JWT
jwt.secret=${JWT_SECRET:whatsapp_super_secret_key_123456789_must_be_long_enough}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Logging (reduce noise on Render)
logging.level.org.apache.kafka=WARN
logging.level.org.springframework.data.redis=WARN