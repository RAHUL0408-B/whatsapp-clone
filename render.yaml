services:
  # ─────────────────────────────────────────────────
  # 1. Spring Boot Backend (Docker)
  # ─────────────────────────────────────────────────
  - type: web
    name: whatsapp-backend
    runtime: docker
    # Build from repo root using root Dockerfile
    dockerContext: .
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /api/auth/health
    envVars:
      - key: PORT
        value: 8080

      # PostgreSQL — injected from Render managed DB
      - key: DB_HOST
        fromDatabase:
          name: whatsapp-postgres-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: whatsapp-postgres-db
          property: port
      - key: POSTGRES_DB
        fromDatabase:
          name: whatsapp-postgres-db
          property: database
      - key: POSTGRES_USER
        fromDatabase:
          name: whatsapp-postgres-db
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: whatsapp-postgres-db
          property: password

      # JWT
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: 86400000

      # Disable Redis & Kafka on Render free tier
      - key: REDIS_ENABLED
        value: false
      - key: KAFKA_ENABLED
        value: false

      # Timezone
      - key: JAVA_TOOL_OPTIONS
        value: -Duser.timezone=UTC

  # ─────────────────────────────────────────────────
  # 2. React Frontend (Static Site)
  # ─────────────────────────────────────────────────
  - type: web
    name: whatsapp-frontend
    runtime: static
    rootDir: whatsapp-frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./build
    plan: free
    region: oregon
    envVars:
      - key: REACT_APP_API_URL
        fromService:
          name: whatsapp-backend
          type: web
          property: host
          envVarKey: REACT_APP_API_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  # ─────────────────────────────────────────────────
  # 3. Managed PostgreSQL Database
  # ─────────────────────────────────────────────────
  - name: whatsapp-postgres-db
    databaseName: whatsapp_clone
    user: admin
    plan: free
    region: oregon
